<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Historial de alquileres · Machi Next</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/admin-rentals.css">
  <script src="/admin-rentals.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">Machi<span>Next</span></a>
    <nav class="top-actions" aria-label="Navegación administrativa">
      <a class="nav-link" href="/admin.html">Revisar daños</a>
      <a class="nav-link" href="/admin-accounts.html">Usuarios y negocios</a>
      <a class="nav-link" href="/admin-reports.html">Reportes globales</a>
      <a class="nav-link" href="/">Catálogo</a>
    </nav>
  </header>
  <main class="admin-rentals-main">
    <section class="rentals-heading">
      <p class="eyebrow">ADMINISTRACIÓN GLOBAL</p>
      <h1>Historial de alquileres</h1>
      <p>Consulta reservas, entregas y devoluciones de todos los negocios.</p>
      <div class="rentals-toolbar">
        <p id="rentals-status" role="status" aria-live="polite">Cargando historial…</p>
        <button id="refresh-rentals" class="button button-outline" type="button">Actualizar</button>
      </div>
    </section>
    <section class="rentals-panel" aria-label="Filtros del historial">
      <label>Buscar
        <input id="rental-search" type="search" placeholder="Cliente, negocio, equipo o reserva">
      </label>
      <label>Estado
        <select id="rental-status-filter">
          <option value="">Todos los estados</option>
          <option value="PENDING_PROVIDER">Pendiente del proveedor</option>
          <option value="CONFIRMED">Confirmada</option>
          <option value="IN_RENTAL">En alquiler</option>
          <option value="COMPLETED">Finalizada</option>
          <option value="REJECTED">Rechazada</option>
          <option value="CANCELLED">Cancelada</option>
        </select>
      </label>
    </section>
    <section id="rental-list" class="rental-list" aria-live="polite"></section>
  </main>
</body>
</html>
