spring:
  application:
    name: machi-next-api
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${MYSQL_DATABASE:machi_next}?serverTimezone=UTC
    username: ${MYSQL_USER:machi_app}
    password: ${MYSQL_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8080}

app:
  security:
    jwt-secret: ${JWT_SECRET:local-development-secret-change-this-before-deploying-2026}
    jwt-ttl-minutes: ${JWT_TTL_MINUTES:60}
    admin-bootstrap-token: ${ADMIN_BOOTSTRAP_TOKEN:}
  evidence:
    storage-directory: ${EVIDENCE_STORAGE_DIRECTORY:./uploads/evidence}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
