name: machi-next

services:
  db:
    image: mysql:8.4
    container_name: machi-next-mysql
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${MYSQL_BIND_ADDRESS:-127.0.0.1}:${MYSQL_PORT:-3306}:3306"
    volumes:
      - machi_mysql_data:/var/lib/mysql
      - ./database/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./database/002_seed_demo.sql:/docker-entrypoint-initdb.d/002_seed_demo.sql:ro
      - ./database/003_provider_transfer_approvals.sql:/docker-entrypoint-initdb.d/003_provider_transfer_approvals.sql:ro
      - ./database/004_provider_transfer_wait.sql:/docker-entrypoint-initdb.d/004_provider_transfer_wait.sql:ro
      - ./database/005_business_administrators.sql:/docker-entrypoint-initdb.d/005_business_administrators.sql:ro
      - ./database/006_provider_transfer_automation.sql:/docker-entrypoint-initdb.d/006_provider_transfer_automation.sql:ro
      - ./database/007_reservation_approval.sql:/docker-entrypoint-initdb.d/007_reservation_approval.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping --protocol=tcp -h 127.0.0.1 -uroot --password="$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  machi_mysql_data:
